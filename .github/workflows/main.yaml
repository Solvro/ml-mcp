name: Main CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── 1. Lint ──────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: extractions/setup-just@v2

      - name: Install Python dependencies
        run: uv sync

      - name: Run linting
        run: just lint-check

  # ── 2. Tests (pytest) ─────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: extractions/setup-just@v2

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-pol

      - name: Install dependencies
        run: uv sync

      - name: Run test suite
        env:
          PREFECT_HOME: ${{ runner.temp }}/prefect
        run: |
          mkdir -p "$PREFECT_HOME"
          just test

  # ── 3. Python build & entry-point check ─────────────────────────────────────
  build-check:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: extractions/setup-just@v2

      - name: Install dependencies
        run: uv sync

      - name: Verify package build
        run: |
          uv build
          ls -lh dist/

      - name: Check entry points
        run: |
          uv run server --help || true
          uv run kg --help || true
          uv run pipeline --help || true

  # ── 4. Integration — the stack as it deploys: nothing published on the host ───
  #
  # compose.stack.yml maps no ports; mcp-server is reachable only over the external
  # `solvro-mcp-internal` network that backend-mcp joins, and Neo4j only from mcp-server.
  # This job asserts exactly that, from the network the backend would use, and then checks
  # that the compose.dev.yml override still republishes the ports on 127.0.0.1 for local work.
  integration:
    runs-on: ubuntu-latest
    needs: [build-check, test]
    env:
      COMPOSE: docker compose --env-file .env -f docker/compose.stack.yml
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies (for the dump/restore CLIs)
        run: uv sync

      - name: Create CI .env
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-ci-placeholder-for-startup-testing' }}
        run: |
          cat > .env <<EOF
          NEO4J_PASSWORD=ci-test-password
          NEO4J_URI=bolt://neo4j:7687
          NEO4J_USER=neo4j
          OPENAI_API_KEY=${OPENAI_API_KEY}
          MCP_BIND_HOST=0.0.0.0
          MCP_HOST=mcp-server
          MCP_PORT=8005
          EOF

      - name: Create the shared internal network
        # Declared `external` in compose so neither stack's `down` removes it from under the
        # other; `just up` does this too, but the job calls compose directly.
        run: just network

      - name: Build images and start stack
        run: $COMPOSE up -d --build --wait --wait-timeout 180

      # ── Smoke tests: production shape ─────────────────────────────────────────

      - name: "Smoke: no host ports are published"
        run: |
          for c in ml-mcp-server ml-mcp-neo4j; do
            if [ -n "$(docker port "$c")" ]; then
              echo "::error::$c publishes host ports: $(docker port "$c" | tr '\n' ' ')"; exit 1
            fi
          done
          echo "no host ports on mcp-server or neo4j"

      - name: "Smoke: MCP /health by service name from the shared network"
        # What backend-mcp's chat-service sees.
        run: |
          docker run --rm --network solvro-mcp-internal curlimages/curl:8.10.1 \
            -sf --max-time 10 http://mcp-server:8005/health

      - name: "Smoke: Neo4j is not reachable from the shared network"
        run: |
          if docker run --rm --network solvro-mcp-internal curlimages/curl:8.10.1 \
               -s --max-time 5 -o /dev/null http://neo4j:7474; then
            echo "::error::neo4j is reachable from solvro-mcp-internal"; exit 1
          fi
          echo "neo4j is not reachable from the shared network"

      - name: "Smoke: the APOC procedures dedup and export call run under the narrowed allowlist"
        # /health already proves the schema procedures (RAG.__init__ dies without them). The
        # other five are only reached by `dedup-graph` and `dump-graph`, which CI never runs, so
        # call them directly on scratch nodes. Both earlier attempts at this config failed on
        # "this one also needs `unrestricted`", and that only ever surfaced by running it.
        run: |
          cypher() { docker exec ml-mcp-neo4j sh -c 'cypher-shell -u neo4j -p "${NEO4J_AUTH#neo4j/}" --format plain "$1"' _ "$1"; }
          cypher "CREATE (a:CiProbe {key:'p', title:'Probe'}), (b:CiProbe:CiFallback {key:'p', title:'Probe fuller'}), (c:CiProbe {name:'c'}) CREATE (b)-[:CI_REL]->(c)"
          cypher "MATCH (a:CiProbe {title:'Probe'}), (b:CiProbe {title:'Probe fuller'}) CALL apoc.refactor.mergeNodes([a,b], {properties:'discard', mergeRels:true, produceSelfRel:false}) YIELD node CALL apoc.create.removeLabels(node, ['CiFallback']) YIELD node AS n RETURN labels(n) AS labels, apoc.coll.sort(['b','a']) AS sorted" | tee /tmp/apoc-smoke.txt
          grep -q '"CiProbe"' /tmp/apoc-smoke.txt && ! grep -q 'CiFallback' /tmp/apoc-smoke.txt && grep -q '\["a", "b"\]' /tmp/apoc-smoke.txt \
            || { echo "::error::mergeNodes / removeLabels / coll.sort did not run as expected"; exit 1; }
          cypher "CALL apoc.export.cypher.all(null, {format:'cypher-shell', stream:true}) YIELD nodes RETURN nodes" | grep -qE '^[0-9]+$' \
            || { echo "::error::apoc.export.cypher.all failed under the narrowed config"; exit 1; }
          cypher "MATCH (n:CiProbe) DETACH DELETE n" >/dev/null
          if cypher "CALL apoc.cypher.runMany('RETURN 1', {})" 2>/dev/null | grep -q .; then
            echo "::error::apoc.cypher.runMany is still loaded"; exit 1
          fi
          echo "dedup and export procedures run; apoc.cypher.* is not loaded"

      - name: "Smoke: LOAD CSV cannot read a file URL"
        # compose.stack.yml turns file URLs off (#93). A file is put in the import directory and the
        # refusal has to name the setting, so a missing file or a wrong path cannot pass for it.
        run: |
          cypher() { docker exec ml-mcp-neo4j sh -c 'cypher-shell -u neo4j -p "${NEO4J_AUTH#neo4j/}" --format plain "$1"' _ "$1"; }
          docker exec ml-mcp-neo4j sh -c 'echo probe > /var/lib/neo4j/import/ci-probe.csv'
          cypher "LOAD CSV FROM 'file:///ci-probe.csv' AS row RETURN count(row) AS rows" > /tmp/load-csv-smoke.txt 2>&1 || true
          docker exec ml-mcp-neo4j rm -f /var/lib/neo4j/import/ci-probe.csv
          cat /tmp/load-csv-smoke.txt
          grep -q "allow_csv_import_from_file_urls' is false" /tmp/load-csv-smoke.txt \
            || { echo "::error::LOAD CSV was not refused by dbms.security.allow_csv_import_from_file_urls"; exit 1; }
          echo "LOAD CSV refuses file URLs"

      - name: "Smoke: the shared network has no route out"
        run: |
          if docker run --rm --network solvro-mcp-internal curlimages/curl:8.10.1 \
               -s --max-time 5 -o /dev/null https://example.com; then
            echo "::error::solvro-mcp-internal can reach the internet"; exit 1
          fi
          echo "no egress from the shared network"

      # ── Smoke tests: dev override ─────────────────────────────────────────────

      - name: "Smoke: compose.dev.yml republishes on 127.0.0.1"
        run: |
          $COMPOSE -f docker/compose.dev.yml up -d --wait --wait-timeout 180
          curl -sf --max-time 10 http://127.0.0.1:8005/health
          curl -sf --max-time 10 -o /dev/null http://127.0.0.1:7474
          for c in ml-mcp-server ml-mcp-neo4j; do
            if docker port "$c" | grep -q '0\.0\.0\.0'; then
              echo "::error::$c is published on 0.0.0.0 under the dev override"; exit 1
            fi
          done
          echo "dev override publishes on loopback only"

      - name: "Smoke: dump-graph and restore-graph round-trip over the driver"
        # Both directions go over Bolt (graph_dump.py, #21): the export is streamed back and
        # written on this side, the restore sends the file's statements. No apoc.cypher.* is
        # loaded and no directory is shared with the container — the first run of this step
        # found the bind-mounted dumps/ chmod 700 by the Neo4j entrypoint, unreadable here.
        # Uses the dev override's 127.0.0.1:7687; the CI .env points NEO4J_URI at the container.
        # A value with a ';' and a relationship are in the probe on purpose — those are the two
        # shapes a naive line splitter gets wrong.
        env:
          NEO4J_URI: bolt://127.0.0.1:7687
        run: |
          cypher() { docker exec ml-mcp-neo4j sh -c 'cypher-shell -u neo4j -p "${NEO4J_AUTH#neo4j/}" --format plain "$1"' _ "$1"; }
          cypher "CREATE (a:CiProbe {key:'r1', title:'Restore me'})-[:CI_REL]->(b:CiProbe {key:'r2', title:'And me; too'})"
          uv run dump-graph
          test -s dumps/graph_export.cypher || { echo "::error::dump-graph wrote nothing to dumps/"; exit 1; }
          cypher "MATCH (n) DETACH DELETE n"
          uv run restore-graph
          cypher "MATCH (a:CiProbe)-[:CI_REL]->(b:CiProbe) RETURN a.title + ' -> ' + b.title AS pair" | tee /tmp/restore-smoke.txt
          grep -q '"Restore me -> And me; too"' /tmp/restore-smoke.txt \
            || { echo "::error::restore-graph did not bring the graph back"; exit 1; }
          leftover=$(cypher 'MATCH (n:`UNIQUE IMPORT LABEL`) RETURN count(n)' | tail -1)
          [ "$leftover" = "0" ] || { echo "::error::restore left $leftover UNIQUE IMPORT LABEL nodes behind"; exit 1; }
          cypher "MATCH (n:CiProbe) DETACH DELETE n" >/dev/null
          rm -f dumps/graph_export.cypher
          echo "dump-graph / restore-graph round-trip over the driver works"

      # ── Cleanup ──────────────────────────────────────────────────────────────

      - name: Dump container logs on failure
        if: failure()
        run: $COMPOSE -f docker/compose.dev.yml logs --no-color

      - name: Tear down stack
        if: always()
        run: |
          $COMPOSE -f docker/compose.dev.yml down -v --remove-orphans
          docker network rm solvro-mcp-internal || true
