# Core MCP Stack: Neo4j + MCP Server
#
# Nothing here publishes a host port. The only consumer of this stack is the chat service in
# Solvro/backend-mcp, which reaches mcp-server by service name over the shared
# `solvro-mcp-internal` network, and Neo4j is reachable only from mcp-server over `mcp_network`.
# That network is created once, outside either Compose project, so neither side owns it and
# either can come up first:
#
#     docker network create --internal solvro-mcp-internal      # `just network` does this
#
# For host-side work (Neo4j browser, `just kg`, `uv run dump-graph`) layer compose.dev.yml on
# top (`just up-dev`); it republishes the ports on 127.0.0.1 only. See #6 in
# ISSUES.prod-readiness.md.
services:
  neo4j:
    image: neo4j:5.18
    container_name: ml-mcp-neo4j
    networks:
      - mcp_network
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - NEO4J_PLUGINS=["apoc"]
      # Only what src/ calls (tests/test_apoc_allowlist.py pins it). No apoc.cypher.* at all,
      # and no file access in either direction: dump-graph streams the export back over Bolt
      # and restore-graph sends the dump the same way (graph_dump.py), so neither
      # apoc.export.file.enabled nor apoc.import.file.enabled is set and no host directory is
      # mounted into the container.
      - NEO4J_dbms_security_procedures_unrestricted=apoc.meta.*,apoc.schema.*,apoc.any.property
      - NEO4J_dbms_security_procedures_allowlist=apoc.meta.*,apoc.schema.*,apoc.any.property,apoc.coll.sort,apoc.refactor.mergeNodes,apoc.create.removeLabels,apoc.export.cypher.all
      # Sized for the target VM (#85). Left unset, Neo4j picks a heap from whatever the host
      # reports, which on a shared box is a number nobody chose; the initial size matches the
      # maximum so the JVM never pauses to resize one.
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    # heap 1G + page cache 512M + ~1G the JVM needs outside both (metaspace, thread stacks,
    # native buffers). Without a limit a runaway query is the host's problem rather than this
    # container's, and the restart policy above cannot help with an OOM it never sees.
    mem_limit: 2560m
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    container_name: ml-mcp-server
    networks:
      - mcp_network
      - solvro_internal
    env_file:
      - ../.env
    environment:
      # .env holds bolt://localhost:7687 for host-side development, where localhost is right.
      # Inside the network localhost is this container, so the service name has to win here.
      - NEO4J_URI=bolt://neo4j:7687
      # The bind inside the container. It has to be 0.0.0.0 for another container to connect;
      # what keeps the server private is the absence of a `ports:` mapping, not the bind.
      - MCP_BIND_HOST=0.0.0.0
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # /health runs a query against Neo4j. The socket check this replaced went green the moment
      # the port bound, so anything depending on service_healthy could be handed a server that
      # cannot answer. See #64.
      test: [ "CMD-SHELL", "curl -f http://localhost:8005/health || exit 1" ]
      interval: 10s
      # Above HEALTH_PING_TIMEOUT_SECONDS in src/mcp_server/server.py, so a stalled graph comes
      # back as a 503 naming the reason instead of a probe killed mid-query.
      timeout: 10s
      retries: 5
      # Measured at 6s on a warm machine, but a first start on freshly built layers has been
      # seen taking minutes. A success ends the start period immediately, so headroom here only
      # delays reporting a container that never comes up, never a healthy one.
      start_period: 180s

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:

networks:
  # Private to this stack: Neo4j is on it and nothing else joins it.
  mcp_network:
    driver: bridge
  # Shared with Solvro/backend-mcp, whose chat-service is the only other member. Declared
  # external so that `docker compose down` on either side leaves it in place for the other.
  solvro_internal:
    external: true
    name: solvro-mcp-internal
