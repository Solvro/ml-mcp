servers:
  mcp:
    transport: "http"
    port: 8005
    host: "127.0.0.1"

  topwr_api:
    host: "0.0.0.0"
    port: 8000
    cors_origins: "*"

rag:
  max_results: 5
  enable_debug: false
  llm_timeout_seconds: 30
  graph_timeout_seconds: 90

data_pipeline:
  max_chunk_size: 30000
  chunk_overlap: 200
  token_limit: 65536

llm:
  fast_model:
    name: "gpt-5.4-nano"
    temperature: 0.1
  accurate_model:
    name: "gpt-5.4-mini"
    temperature: 0
  provider_fallback_order:
    - "openai"
    - "deepseek"
    - "google"
  clarin:
    name: "pllum"
    base_url: "https://services.clarin-pl.eu/api/v1/oapi"
  deepseek:
    base_url: "https://api.deepseek.com"
    fast_model: "deepseek-chat"
    accurate_model: "deepseek-chat"
  gemini:
    name: "gemini-2.5-flash-lite"

observability:
  langfuse:
    host: ${LANGFUSE_HOST}
    secret_key: ${LANGFUSE_SECRET_KEY}
    public_key: ${LANGFUSE_PUBLIC_KEY}

graph_schema:
  # Closed label set for ingestion. The extraction model may not invent labels: the same concept
  # arriving as StudyProgram on one page and Program on the next splits one entity into two nodes
  # that no single query can find. Anything outside this list is mapped through label_aliases, and
  # whatever is still unknown becomes the fallback_label.
  fallback_label: "Topic"
  node_labels:
    - "University"
    - "Faculty"
    - "Department"
    - "Person"
    - "Professor"
    - "Committee"
    - "StudentOrganization"
    - "StudyProgram"
    - "Specialization"
    - "Course"
    - "LearningOutcome"
    - "Building"
    - "Room"
    - "AcademicYear"
    - "Semester"
    - "CalendarEvent"
    - "DayOff"
    - "Deadline"
    - "ExamSession"
    - "Competency"
    - "CompetencyCategory"
    - "Subcompetency"
    - "Criterion"
    - "CriterionCategory"
    - "Guideline"
    - "Document"
    - "Topic"

  # Labels seen in the graph (or likely to be invented) and the canonical label they belong to.
  # Matching is case-insensitive and ignores diacritics, so "wydzial" also resolves to Faculty.
  label_aliases:
    - invented: "Program"
      canonical: "StudyProgram"
    - invented: "Programme"
      canonical: "StudyProgram"
    - invented: "StudyProgramme"
      canonical: "StudyProgram"
    - invented: "FieldOfStudy"
      canonical: "StudyProgram"
    - invented: "Kierunek"
      canonical: "StudyProgram"
    - invented: "Wydzial"
      canonical: "Faculty"
    - invented: "Lecturer"
      canonical: "Professor"
    - invented: "Teacher"
      canonical: "Professor"
    - invented: "Instructor"
      canonical: "Professor"
    - invented: "Employee"
      canonical: "Person"
    - invented: "Staff"
      canonical: "Person"
    - invented: "Student"
      canonical: "Person"
    - invented: "Candidate"
      canonical: "Person"
    - invented: "Author"
      canonical: "Person"
    - invented: "Commission"
      canonical: "Committee"
    - invented: "Organization"
      canonical: "StudentOrganization"
    - invented: "Association"
      canonical: "StudentOrganization"
    - invented: "Subject"
      canonical: "Course"
    - invented: "Class"
      canonical: "Course"
    - invented: "Module"
      canonical: "Course"
    - invented: "Place"
      canonical: "Building"
    - invented: "Location"
      canonical: "Building"
    - invented: "AcademicSemester"
      canonical: "Semester"
    - invented: "Year"
      canonical: "AcademicYear"
    - invented: "Event"
      canonical: "CalendarEvent"
    - invented: "Date"
      canonical: "CalendarEvent"
    - invented: "Break"
      canonical: "CalendarEvent"
    - invented: "Holiday"
      canonical: "DayOff"
    - invented: "PublicHoliday"
      canonical: "DayOff"
    - invented: "FreeDay"
      canonical: "DayOff"
    - invented: "DzienWolny"
      canonical: "DayOff"
    - invented: "Session"
      canonical: "ExamSession"
    - invented: "ExaminationSession"
      canonical: "ExamSession"
    - invented: "Exam"
      canonical: "ExamSession"
    - invented: "Skill"
      canonical: "Competency"
    - invented: "Ability"
      canonical: "Competency"
    - invented: "CompetencyCriterionGroup"
      canonical: "CompetencyCategory"
    - invented: "CriterionGroup"
      canonical: "CriterionCategory"
    - invented: "CriterionItem"
      canonical: "Criterion"
    - invented: "Requirement"
      canonical: "Criterion"
    - invented: "Condition"
      canonical: "Criterion"
    - invented: "Recommendation"
      canonical: "Guideline"
    - invented: "Rule"
      canonical: "Guideline"
    - invented: "Regulation"
      canonical: "Document"
    - invented: "Policy"
      canonical: "Document"
    - invented: "Statute"
      canonical: "Document"
    - invented: "Research"
      canonical: "Document"
    - invented: "Publication"
      canonical: "Document"
    - invented: "Article"
      canonical: "Document"

  # Preferred relationship types. Unlike labels these are not rewritten, because a wrong
  # relationship type is visible in the traversal while a wrong label silently hides the node.
  relationship_types:
    - "PART_OF"
    - "BELONGS_TO"
    - "OFFERED_BY"
    - "RUNS"
    - "MEMBER_OF"
    - "CHAIRS"
    - "SUPERVISES"
    - "TEACHES"
    - "EMPLOYED_BY"
    - "PREREQUISITE_FOR"
    - "INCLUDES_COURSE"
    - "HAS_SPECIALIZATION"
    - "HAS_LEARNING_OUTCOME"
    - "LOCATED_IN"
    - "HAS_ROOM"
    - "TAKES_PLACE_IN"
    - "HAS_SEMESTER"
    - "STARTS_ON"
    - "ENDS_ON"
    - "OCCURS_ON"
    - "HAS_DEADLINE"
    - "HAS_EVENT"
    - "HAS_DAY_OFF"
    - "HAS_EXAM_SESSION"
    - "HAS_CATEGORY"
    - "HAS_SUBCOMPETENCY"
    - "HAS_CRITERION"
    - "REQUIRES"
    - "RECOMMENDS"
    - "CONSIDERS"
    - "ASSESSES"
    - "DEFINED_IN"

database:
  name: "neo4j"
  uri: ${NEO4J_URI}
  username: ${NEO4J_USER}
  password: ${NEO4J_PASSWORD}

prompts:
  final_answer: |
    You receive information in JSON format from another LLM
    containing data from the knowledge base.

    Context: You are an assistant for Wrocław University of Science and Technology (Politechnika Wrocławska, PWr).
    Assume that any mention of professors, teachers, courses, classes, departments, or other academic entities
    refers to Politechnika Wrocławska unless explicitly stated otherwise.

    Conversation history (most recent turns):
    {history}

    User question: {user_input}

    Knowledge base data (JSON format):
    {data}

    Your task is to answer the user's question based on this information.
    Use the conversation history to resolve references like "he", "she", "that course", "who is that guy?", etc.
    Use all data from the JSON to provide a complete answer.
    Always respond in the same language as the user's question, in a natural and concise way.
    If you do not receive relevant information, answer from general knowledge about Politechnika Wrocławska.

  cypher_insert: |
    Extract knowledge from the provided context into Neo4j Cypher MERGE statements.
    Invent node labels and relationship types that best represent the content.
    Use the current graph schema to stay consistent with existing structure where appropriate.
    DO NOT include any additional text or explanations.

    CONTEXT: {context}

    CURRENT GRAPH SCHEMA (use for consistency, extend freely):
    {schema_context}

    STRICT RULES:
    1. OUTPUT MUST:
       - Contain ONLY executable Cypher statements
       - Begin with "MERGE"
       - Separate multiple statements with PIPE character (|)
       - Use UNIQUE variable names (node1, node2, etc. - never reused)
       - LIMIT TOKENS TO 65536 TO AVOID ERRORS WITH DEEPSEEK API

    2. FOR NODES:
       - MERGE each node with unique variable name
       - Include 'title' and 'context' properties
       - Replace Polish characters (ą→a, ć→c, ę→e, ł→l, ń→n, ó→o, ś→s, ź→z, ż→z)
       - Use ONLY ASCII characters
       - Escape single quotes in text with backslash (\')

    3. FOR RELATIONSHIPS:
       - MERGE between existing node variables
       - Use descriptive relationship type names in UPPER_SNAKE_CASE
       - Direction matters (A→B ≠ B→A)

    4. VARIABLE NAMES:
       - Must be UNIQUE across entire query
       - Recommended pattern: (node1), (node2), (person1), (dept1), etc.
       - NEVER reuse variables - this causes errors

    EXAMPLE OUTPUT:
    MERGE (node1:Person {{title: 'John Smith',
    context: 'Professor at UW'}})|MERGE (node2:Department
    {{title: 'Computer Science', context: 'CS department'}})|MERGE
    (node1)-[:WORKS_IN]->(node2)

    OUTPUT MUST BE EXACTLY IN THIS FORMAT:
    MERGE (...) [|MERGE (...)]* [|MERGE (...)-[:...]->(...)]*
    NO OTHER TEXT OR CHARACTERS ALLOWED!

  schema_reflection: |
    Analyze the current Neo4j graph schema and summarize it to guide the next extraction pass.

    SCHEMA:
    {schema}

    Respond in this exact format:
    NODE TYPES: <comma-separated labels with node counts if available>
    RELATIONSHIP TYPES: <comma-separated relationship types>
    OBSERVATIONS: <1-2 sentences on structure patterns or notable gaps>
    EXTRACTION HINTS: <what types of entities or relations to prioritize next>

  cypher_search: |
    Generate a single valid Cypher READ query to answer the question. No explanations, no markdown.

    Schema (includes sample property values):
    {schema}

    Original question (use this to understand intent): {user_question}
    Normalized search form (use this for string values): {normalized_question}

    Rules:
    - Use MATCH, not MERGE or CREATE
    - Copy node labels, relationship types, and property keys exactly from the schema,
      including their case; never invent schema identifiers
    - Never alter or normalize labels, relationship types, or property keys
    - Human-readable string comparison literals must come from the normalized search form and
      use lowercase ASCII text without Polish diacritics
    - Preserve the exact spelling and case of stable IDs; do not treat IDs as human-readable text
    - For string properties use case-insensitive matching on both sides, for example:
      toLower(n.title) CONTAINS toLower('wydzial informatyki')
    - Prefer CONTAINS for human-readable entity names; use exact equality only for stable IDs or
      non-string values
    - Always RETURN named properties, not full nodes (e.g. RETURN p.title, c.title)
    - Always add LIMIT 10

    Cypher:

  guardrails: |
    You are a classifier for a Wrocław University of Science and Technology (Politechnika Wrocławska) assistant.
    Assume that any question mentioning professors, teachers, courses, classes, departments, buildings,
    research, or other academic topics refers to Politechnika Wrocławska.
    Decide whether to continue graph retrieval ("generate") or stop ("end").
    Answer ONLY with valid JSON in this exact shape:
    {{"decision": "generate"}}
    or
    {{"decision": "end"}}

    Question: {user_question}
    Answer:
